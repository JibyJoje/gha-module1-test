name: Lint, Test and Deploy
on: push
jobs:
  lint-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: install dependencies
        run: |
          echo "Installing dependencies..."
          npm install
      - name: lint code
        run: |
          echo "Linting code..."
          npm run lint
      - name: test code
        run: |
          echo "Testing code..."
          npm test
      - name: build code
        run: |
          echo "Building code..."
          npm run build
      - name: deploy code
        run: |
          echo "Deploying code..."